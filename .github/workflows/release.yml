# Publishes to PyPI on a version tag, through PyPI trusted publishing
# (project open61850, workflow release.yml, environment pypi): no token.

name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import open61850; print(open61850.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
      - run: python -m pip install build pytest
      - run: python -m pytest
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
