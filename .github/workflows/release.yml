# Publishes open61850 and open61850-rt to PyPI on a version tag, through PyPI
# trusted publishing (workflow release.yml, environment pypi, registered on
# both projects): no token. Both carry the version of the tag.

name: release

on:
  push:
    tags: ["v*"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check that the tag matches both versions
        run: |
          py=$(python -c "import sys; sys.path.insert(0, 'src'); import open61850; print(open61850.__version__)")
          rs=$(sed -n 's/^version = "\(.*\)"/\1/p' native/Cargo.toml | head -1)
          test "v$py" = "$GITHUB_REF_NAME" -a "v$rs" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, open61850 $py, open61850-rt $rs"; exit 1; }
      - run: python -m pip install build pytest
      - run: python -m pytest
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-python
          path: dist/

  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-native-${{ matrix.target }}
          path: native/dist/

  native-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-native-sdist
          path: native/dist/

  publish:
    needs: [python, native, native-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - run: ls -l dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
