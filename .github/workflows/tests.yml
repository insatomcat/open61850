name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest
      # AF_PACKET on lo needs CAP_NET_RAW
      - run: sudo "$(which python)" -m pytest tests/test_capture.py tests/test_sv_publisher.py
      - run: python -m pip install . && open61850-mms --help

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest ./native
      - run: python -m pytest tests/test_sv_native.py
      - run: sudo "$(which python)" -m pytest -s tests/test_sv_native.py
