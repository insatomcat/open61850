name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest
      # AF_PACKET on lo needs CAP_NET_RAW
      - run: sudo "$(which python)" -m pytest tests/test_capture.py tests/test_sv_publisher.py
      - run: python -m pip install . && open61850-mms --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Pinned: a new release may add checks; bump on purpose.
      - run: python -m pip install ruff==0.16.9 mypy==2.3.1
      - run: ruff check src tests tools examples
      - run: mypy

  other-os:
    # The pure Python part; the AF_PACKET tests skip themselves.
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest
      - run: python -m pip install . && open61850-supervise --help

  interop:
    # libiec61850's example servers and publishers as peers (tools/interop).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/interop/run.sh -v

  fuzz:
    # Each open61850-core fuzz target for a minute (native/fuzz). The target
    # is explicit: the prebuilt cargo-fuzz is a musl binary and would default
    # to musl, which the sanitizers refuse.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - working-directory: native/fuzz
        run: |
          for target in sv_decode goose_decode goose_roundtrip; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
          done

  capi-package:
    # libopen61850 packaged as a release packages it (manylinux2014, glibc
    # 2.17), then used through pkg-config on the runner's newer system.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: native/capi/package-manylinux.sh dist
      - run: native/capi/tests/test_package.sh dist/libopen61850-*.tar.gz

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: cargo test --manifest-path native/Cargo.toml -p open61850-core
      - run: cargo clippy --manifest-path native/Cargo.toml -p open61850-core -p open61850-c --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - run: native/capi/tests/run.sh
      - run: python -m pip install pytest ./native
      - run: python -m pytest tests/test_sv_native.py tests/test_sv_decode_native.py tests/test_goose_encode_native.py tests/test_goose_decode_native.py
      - run: sudo "$(which python)" -m pytest -s tests/test_sv_native.py
