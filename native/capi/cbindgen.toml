# cbindgen --config cbindgen.toml --output include/open61850.h (from native/capi)

language = "C"
header = "/* Copyright 2026 Florent Carli\n * SPDX-License-Identifier: Apache-2.0 */"
autogen_warning = "/* Generated by cbindgen from native/capi/src/lib.rs: do not edit. */"
include_guard = "OPEN61850_H"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
usize_is_size_t = true
line_length = 100

[export]
include = ["o61850_data_value"]
