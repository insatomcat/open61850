[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open61850"
dynamic = ["version"]
description = "IEC 61850 in pure Python: MMS client, GOOSE, Sampled Values, SCL, BER."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Florent Carli" }]
keywords = ["iec61850", "mms", "goose", "sampled-values", "substation", "scl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]

[project.optional-dependencies]
# The real-time Sampled Values engine (Rust, Linux wheels).
rt = ["open61850-rt==0.6.0; sys_platform == 'linux'"]

[project.urls]
Repository = "https://github.com/insatomcat/open61850"
Issues = "https://github.com/insatomcat/open61850/issues"

[project.scripts]
open61850-mms = "open61850.mms.__main__:main"
open61850-sv = "open61850.sv_publisher:main"
open61850-goose = "open61850.goose_publisher:main"
open61850-supervise = "open61850.supervision:main"
open61850-server = "open61850.server.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "open61850.__version__" }

[tool.setuptools.package-data]
open61850 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "RUF"]
# The code writes Optional[...] and Union[...], and zips lists whose lengths it checked.
ignore = ["UP007", "UP045", "RUF022", "RUF005", "B905"]

[tool.ruff.lint.per-file-ignores]
# Golden bytes and long assertions read better on one line.
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: safe as default arguments.
extend-immutable-calls = ["open61850.mms.association.AssociationParameters", "open61850.mms.control.Origin",
                          "AssociationParameters", "Origin"]

[tool.ruff.lint.isort]
known-first-party = ["open61850"]
known-third-party = ["conftest"]

[tool.mypy]
python_version = "3.10"
platform = "linux"  # the AF_PACKET code is Linux only
files = ["src/open61850"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["open61850_rt"]  # the optional native engine
ignore_missing_imports = true
